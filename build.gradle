plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
	id 'maven-publish'
	id 'com.modrinth.minotaur' version '2.9.0'
}

version = project.mod_version
group = project.maven_group

repositories {
	maven {
		name = 'Forge Maven'
		url = 'https://maven.minecraftforge.net/'
	}

	maven {
		name = "Terraformers"
		url = "https://maven.terraformersmc.com/releases"
	}

}

loom {
	accessWidenerPath = file("src/main/resources/rawlands.accesswidener")

	mods {
		"rawlands" {
			sourceSet sourceSets.main
		}
	}

	runs {
		client {
			vmArg "-Xmx8G"
		}
	}
}

fabricApi {
	configureDataGeneration {
		client = true
		outputDirectory = file("build/generated/rawlands")
	}
}

sourceSets.main.resources.setSrcDirs(["src/main/resources"])

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "com.terraformersmc:modmenu:${project.modmenu_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
	implementation "com.github.glitchfiend:TerraBlender-fabric:${project.terrablender_version}"
}

processResources {
	def props = ["version": project.version]
	inputs.properties props

	filesMatching("fabric.mod.json") {
		expand props
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

java {
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

jar {
	def projectName = project.name
	inputs.property "projectName", projectName

	archiveFileName = "${projectName}-${project.version}-${project.minecraft_version}.jar"

	from("LICENSE") {
		rename { "${it}_${projectName}"}
	}
}

modrinth {
	token = project.findProperty("modrinth_token") ?: System.getenv("MODRINTH_TOKEN")
	projectId = "41epYhDW"
	versionType = "release"
	uploadFile = jar
	gameVersions = [project.minecraft_version]
	changelog = file("CHANGELOG.md").text.split("\n## ", 3)[1].trim()
	dependencies {
		required.project "fabric-api"
		required.project "terrablender"
	}
}


publishing {
	publications {
		create("mavenJava", MavenPublication) {
			from components.java
		}
	}

}
